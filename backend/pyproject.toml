[project]
name = "infowatch-backend"
version = "0.1.0"
description = "InfoWatch - Notification Aggregator Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.0.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pywebpush>=2.0.0",
    "py-vapid>=1.9.0",
    "apscheduler>=3.10.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
