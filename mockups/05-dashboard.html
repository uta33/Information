<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案5: ダッシュボード</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #e5e7eb; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .phone { width: 390px; height: 844px; background: #f3f4f6; border-radius: 44px; box-shadow: 0 0 0 2px #d1d5db, 0 40px 100px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; }
  .summary-card { cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
  .summary-card:hover { transform: scale(1.04); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
  .list-row { transition: background 0.15s; cursor: pointer; }
  .list-row:hover { background: #e9edf1; }
  .scrollable { overflow-y: auto; scrollbar-width: none; }
  .scrollable::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div class="phone">
  <!-- Status bar -->
  <div class="flex justify-between items-center px-8 pt-5 pb-1 text-sm font-semibold bg-gray-100">
    <span>9:41</span>
    <span class="text-xs">●●● WiFi 🔋</span>
  </div>

  <!-- Header -->
  <div class="px-5 pt-3 pb-4 bg-gray-100">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">InfoWatch</h1>
        <p class="text-xs text-gray-500">2026年4月2日 · 最終更新 9:38</p>
      </div>
      <div class="relative">
        <div class="w-10 h-10 bg-white rounded-full shadow flex items-center justify-center">
          <span class="text-lg">🔔</span>
        </div>
        <span class="absolute -top-0.5 -right-0.5 w-5 h-5 bg-red-500 rounded-full text-white text-xs flex items-center justify-center font-bold">3</span>
      </div>
    </div>
  </div>

  <div class="scrollable flex-1 px-4 space-y-4 py-3">

    <!-- Summary cards 2x2 grid -->
    <div class="grid grid-cols-2 gap-3">
      <div class="summary-card bg-white rounded-2xl p-4 shadow-sm">
        <div class="flex items-center gap-2 mb-2">
          <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
          <span class="text-xs font-semibold text-gray-500">致命的</span>
        </div>
        <div class="text-4xl font-bold text-red-600">2</div>
        <div class="text-xs text-gray-400 mt-1">+1 今日</div>
      </div>
      <div class="summary-card bg-white rounded-2xl p-4 shadow-sm">
        <div class="flex items-center gap-2 mb-2">
          <span class="w-3 h-3 rounded-full bg-orange-500 inline-block"></span>
          <span class="text-xs font-semibold text-gray-500">高</span>
        </div>
        <div class="text-4xl font-bold text-orange-500">5</div>
        <div class="text-xs text-gray-400 mt-1">+2 今日</div>
      </div>
      <div class="summary-card bg-white rounded-2xl p-4 shadow-sm">
        <div class="flex items-center gap-2 mb-2">
          <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
          <span class="text-xs font-semibold text-gray-500">中</span>
        </div>
        <div class="text-4xl font-bold text-yellow-500">8</div>
        <div class="text-xs text-gray-400 mt-1">+3 今日</div>
      </div>
      <div class="summary-card bg-white rounded-2xl p-4 shadow-sm">
        <div class="flex items-center gap-2 mb-2">
          <span class="w-3 h-3 rounded-full bg-blue-400 inline-block"></span>
          <span class="text-xs font-semibold text-gray-500">情報</span>
        </div>
        <div class="text-4xl font-bold text-blue-400">15</div>
        <div class="text-xs text-gray-400 mt-1">+5 今日</div>
      </div>
    </div>

    <!-- Source breakdown bar -->
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <div class="text-xs font-semibold text-gray-500 mb-2">ソース内訳</div>
      <div class="flex rounded-full overflow-hidden h-3 gap-px">
        <div class="bg-red-500 h-full" style="width:35%" title="CVE/NVD"></div>
        <div class="bg-orange-400 h-full" style="width:25%" title="JVN"></div>
        <div class="bg-blue-400 h-full" style="width:40%" title="RSS"></div>
      </div>
      <div class="flex gap-4 mt-2 text-xs text-gray-500">
        <span><span class="text-red-500 font-bold">■</span> CVE/NVD</span>
        <span><span class="text-orange-400 font-bold">■</span> JVN</span>
        <span><span class="text-blue-400 font-bold">■</span> RSS</span>
      </div>
    </div>

    <!-- Latest alerts section -->
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <div class="flex justify-between items-center px-4 py-3 border-b border-gray-100">
        <span class="font-semibold text-gray-900 text-sm">最新アラート</span>
        <button class="text-xs text-blue-600 font-medium">すべて表示 →</button>
      </div>

      <div class="list-row flex items-center gap-3 px-4 py-3 border-b border-gray-50">
        <span class="w-2.5 h-2.5 rounded-full bg-red-500 flex-shrink-0"></span>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-gray-900 truncate">CVE-2024-1234</div>
          <div class="text-xs text-gray-400 truncate">Apache HTTP Server RCE</div>
        </div>
        <span class="text-xs text-gray-400 flex-shrink-0">3分前</span>
      </div>

      <div class="list-row flex items-center gap-3 px-4 py-3 border-b border-gray-50">
        <span class="w-2.5 h-2.5 rounded-full bg-orange-500 flex-shrink-0"></span>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-gray-900 truncate">JVN#12345678</div>
          <div class="text-xs text-gray-400 truncate">OpenSSL バッファオーバーフロー</div>
        </div>
        <span class="text-xs text-gray-400 flex-shrink-0">15分前</span>
      </div>

      <div class="list-row flex items-center gap-3 px-4 py-3 border-b border-gray-50">
        <span class="w-2.5 h-2.5 rounded-full bg-red-500 flex-shrink-0"></span>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-gray-900 truncate">CVE-2024-5678</div>
          <div class="text-xs text-gray-400 truncate">Linux Kernel 権限昇格</div>
        </div>
        <span class="text-xs text-gray-400 flex-shrink-0">22分前</span>
      </div>

      <div class="list-row flex items-center gap-3 px-4 py-3">
        <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 flex-shrink-0"></span>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-medium text-gray-700 truncate">セキュリティブログ</div>
          <div class="text-xs text-gray-400 truncate">新しいフィッシング攻撃手法</div>
        </div>
        <span class="text-xs text-gray-400 flex-shrink-0">1時間前</span>
      </div>
    </div>

    <div class="h-2"></div>

  </div>

  <!-- Bottom nav -->
  <div class="flex border-t border-gray-200 bg-white">
    <button class="flex-1 py-3 flex flex-col items-center gap-0.5">
      <span class="text-2xl">🏠</span>
      <span class="text-xs text-blue-600 font-medium">ホーム</span>
    </button>
    <button class="flex-1 py-3 flex flex-col items-center gap-0.5">
      <span class="text-2xl">📋</span>
      <span class="text-xs text-gray-400">全一覧</span>
    </button>
    <button class="flex-1 py-3 flex flex-col items-center gap-0.5">
      <span class="text-2xl">📡</span>
      <span class="text-xs text-gray-400">ソース</span>
    </button>
    <button class="flex-1 py-3 flex flex-col items-center gap-0.5">
      <span class="text-2xl">⚙️</span>
      <span class="text-xs text-gray-400">設定</span>
    </button>
  </div>
</div>
</body>
</html>
