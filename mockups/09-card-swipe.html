<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案9: カードスワイプ</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #111827; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .phone { width: 390px; height: 844px; background: #111827; border-radius: 44px; box-shadow: 0 0 0 2px #374151, 0 40px 100px rgba(0,0,0,0.8); overflow: hidden; display: flex; flex-direction: column; }
  .main-card { border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); transition: transform 0.3s; cursor: grab; }
  .main-card:hover { transform: scale(1.01) rotate(-0.5deg); }
  .bg-card-1 { background: linear-gradient(145deg, #1a0000, #3b0000); border: 1px solid rgba(239,68,68,0.3); }
  .bg-card-2 { background: linear-gradient(145deg, #1a0a00, #3b1500); border: 1px solid rgba(249,115,22,0.3); }
  .progress-ring { transform: rotate(-90deg); }
  .action-btn { transition: all 0.2s; cursor: pointer; }
  .action-btn:hover { transform: scale(1.1); }
  .scrollable { overflow-y: auto; scrollbar-width: none; }
  .scrollable::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div class="phone">
  <!-- Status bar -->
  <div class="flex justify-between items-center px-8 pt-5 pb-1 text-sm font-medium text-gray-400">
    <span>9:41</span>
    <span class="text-xs">●●● WiFi 🔋</span>
  </div>

  <!-- Header -->
  <div class="flex justify-between items-center px-5 py-3">
    <div>
      <span class="text-gray-500 text-sm">アラート確認</span>
      <p class="text-white font-bold text-lg">InfoWatch</p>
    </div>
    <div class="text-center">
      <span class="text-2xl font-bold text-white">3</span>
      <p class="text-gray-500 text-xs">/ 12</p>
    </div>
  </div>

  <!-- Progress dots -->
  <div class="flex justify-center gap-1.5 pb-4">
    <span class="w-6 h-1.5 rounded-full bg-red-500"></span>
    <span class="w-6 h-1.5 rounded-full bg-orange-400"></span>
    <span class="w-2 h-1.5 rounded-full bg-gray-600"></span>
    <span class="w-2 h-1.5 rounded-full bg-gray-700"></span>
    <span class="w-2 h-1.5 rounded-full bg-gray-700"></span>
  </div>

  <!-- Main card (deck effect: 2 cards stacked) -->
  <div class="flex-1 relative mx-5">

    <!-- Card 3 (behind) -->
    <div class="absolute inset-x-4 top-4 bottom-0 rounded-2xl" style="background:rgba(255,255,255,0.04); transform: rotate(2deg) scale(0.95);"></div>
    <!-- Card 2 (middle) -->
    <div class="absolute inset-x-2 top-2 bottom-0 rounded-2xl" style="background:rgba(255,255,255,0.06); transform: rotate(-1deg) scale(0.97);"></div>

    <!-- Card 1 (front) — CRITICAL -->
    <div class="main-card bg-card-1 absolute inset-0 p-6 flex flex-col">

      <!-- Card header -->
      <div class="flex justify-between items-start mb-4">
        <div>
          <span class="text-xs font-bold text-red-400 border border-red-600 px-2 py-0.5 rounded-full">● CRITICAL</span>
          <div class="text-xs text-gray-400 mt-1">CVE · NVD · 3分前</div>
        </div>
        <!-- CVSS ring -->
        <div class="relative w-16 h-16">
          <svg class="w-16 h-16 progress-ring" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(239,68,68,0.2)" stroke-width="5"/>
            <circle cx="32" cy="32" r="26" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="163.4" stroke-dashoffset="3.3" stroke-linecap="round"/>
          </svg>
          <div class="absolute inset-0 flex items-center justify-center flex-col">
            <span class="text-white font-bold text-sm">9.8</span>
            <span class="text-red-400 text-xs">CVSS</span>
          </div>
        </div>
      </div>

      <!-- Main content -->
      <div class="flex-1">
        <h2 class="text-2xl font-bold text-white mb-2">CVE-2024-1234</h2>
        <h3 class="text-base font-semibold text-red-300 mb-3">Apache HTTP Server リモートコード実行</h3>
        <p class="text-sm text-gray-400 leading-relaxed">Apache HTTP Server バージョン 2.4.0〜2.4.57 においてリモートコード実行が可能な脆弱性が発見されました。認証なしの攻撃者が任意のコードを実行できる可能性があります。</p>

        <div class="mt-4 space-y-2">
          <div class="flex items-center gap-2 text-sm">
            <span class="text-gray-500 w-16">影響</span>
            <span class="text-white">Apache 2.4.0〜2.4.57</span>
          </div>
          <div class="flex items-center gap-2 text-sm">
            <span class="text-gray-500 w-16">攻撃</span>
            <span class="text-red-300">リモート・認証不要</span>
          </div>
          <div class="flex items-center gap-2 text-sm">
            <span class="text-gray-500 w-16">対応</span>
            <span class="text-green-300">2.4.58 にアップデート</span>
          </div>
        </div>
      </div>

      <!-- Action hint -->
      <div class="flex justify-between items-center mt-4 pt-4 border-t border-red-900/30">
        <div class="flex items-center gap-2 text-gray-500 text-xs">
          <span>←</span>
          <span>スキップ</span>
        </div>
        <button class="text-blue-400 text-sm font-medium">詳細を開く ↗</button>
        <div class="flex items-center gap-2 text-gray-500 text-xs">
          <span>完了</span>
          <span>→</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Action buttons -->
  <div class="flex justify-center items-center gap-6 py-5">
    <button class="action-btn w-14 h-14 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center shadow-lg">
      <span class="text-2xl">↩</span>
    </button>
    <button class="action-btn w-16 h-16 rounded-full bg-gray-700 border border-gray-600 flex items-center justify-center shadow-lg">
      <span class="text-2xl text-gray-400">✕</span>
    </button>
    <button class="action-btn w-16 h-16 rounded-full flex items-center justify-center shadow-lg" style="background: linear-gradient(135deg, #3b82f6, #6366f1);">
      <span class="text-2xl text-white">✓</span>
    </button>
    <button class="action-btn w-14 h-14 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center shadow-lg">
      <span class="text-2xl">⭐</span>
    </button>
  </div>

  <!-- Bottom nav -->
  <div class="flex border-t border-gray-800 bg-gray-900">
    <button class="flex-1 py-3 flex flex-col items-center gap-0.5">
      <span class="text-xl">🃏</span>
      <span class="text-xs text-blue-400 font-medium">カード</span>
    </button>
    <button class="flex-1 py-3 flex flex-col items-center gap-0.5">
      <span class="text-xl">📋</span>
      <span class="text-xs text-gray-500">一覧</span>
    </button>
    <button class="flex-1 py-3 flex flex-col items-center gap-0.5">
      <span class="text-xl">📡</span>
      <span class="text-xs text-gray-500">ソース</span>
    </button>
    <button class="flex-1 py-3 flex flex-col items-center gap-0.5">
      <span class="text-xl">⚙️</span>
      <span class="text-xs text-gray-500">設定</span>
    </button>
  </div>
</div>
</body>
</html>
