<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案7: ネオモーフィズム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #c8d0dc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .phone { width: 390px; height: 844px; background: #dde4ed; border-radius: 44px; box-shadow: 12px 12px 30px #b5bcc8, -12px -12px 30px #ffffff; overflow: hidden; display: flex; flex-direction: column; }
  .neu-card { background: #dde4ed; border-radius: 16px; box-shadow: 6px 6px 14px #b5bcc8, -6px -6px 14px #ffffff; transition: box-shadow 0.2s; cursor: pointer; }
  .neu-card:hover { box-shadow: 3px 3px 8px #b5bcc8, -3px -3px 8px #ffffff; }
  .neu-inset { background: #dde4ed; border-radius: 12px; box-shadow: inset 4px 4px 8px #b5bcc8, inset -4px -4px 8px #ffffff; }
  .neu-btn { background: #dde4ed; border-radius: 50px; box-shadow: 4px 4px 10px #b5bcc8, -4px -4px 10px #ffffff; transition: box-shadow 0.15s; cursor: pointer; }
  .neu-btn:hover { box-shadow: 2px 2px 6px #b5bcc8, -2px -2px 6px #ffffff; }
  .scrollable { overflow-y: auto; scrollbar-width: none; }
  .scrollable::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div class="phone">
  <!-- Status bar -->
  <div class="flex justify-between items-center px-8 pt-5 pb-1 text-sm font-medium text-gray-500">
    <span>9:41</span>
    <span class="text-xs">●●● WiFi 🔋</span>
  </div>

  <!-- Header -->
  <div class="px-5 pt-3 pb-4">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-700">InfoWatch</h1>
        <p class="text-xs text-gray-400 mt-0.5">未読 12件</p>
      </div>
      <div class="neu-btn w-12 h-12 flex items-center justify-center relative">
        <span class="text-xl text-gray-500">🔔</span>
        <span class="absolute top-1 right-1 w-4 h-4 bg-indigo-500 rounded-full text-white text-xs flex items-center justify-center font-bold" style="font-size:10px;">3</span>
      </div>
    </div>
  </div>

  <!-- Search bar (inset) -->
  <div class="px-5 mb-4">
    <div class="neu-inset flex items-center gap-2 px-4 py-2.5">
      <span class="text-gray-400">🔍</span>
      <span class="text-gray-400 text-sm">検索...</span>
    </div>
  </div>

  <!-- Filter tabs -->
  <div class="flex gap-2 px-5 mb-4 overflow-x-auto" style="scrollbar-width:none;">
    <button class="neu-btn flex-shrink-0 px-4 py-1.5 text-xs font-semibold text-indigo-600">全て</button>
    <button class="neu-btn flex-shrink-0 px-4 py-1.5 text-xs font-semibold text-gray-500">CRITICAL</button>
    <button class="neu-btn flex-shrink-0 px-4 py-1.5 text-xs font-semibold text-gray-500">HIGH</button>
    <button class="neu-btn flex-shrink-0 px-4 py-1.5 text-xs font-semibold text-gray-500">CVE</button>
    <button class="neu-btn flex-shrink-0 px-4 py-1.5 text-xs font-semibold text-gray-500">JVN</button>
  </div>

  <!-- Card list -->
  <div class="scrollable flex-1 px-5 space-y-4 pb-4">

    <div class="neu-card p-4">
      <div class="flex justify-between items-center mb-2">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-red-400 shadow-sm"></span>
          <span class="text-xs font-bold text-red-500">CRITICAL</span>
          <span class="text-xs text-gray-400">CVE</span>
        </div>
        <span class="text-xs text-gray-400">3分前</span>
      </div>
      <div class="text-base font-bold text-gray-700 mb-1">CVE-2024-1234</div>
      <div class="text-sm text-gray-500 mb-3">Apache HTTP Server リモートコード実行</div>
      <div class="neu-inset px-3 py-2">
        <div class="flex justify-between text-xs text-gray-400 mb-1">
          <span>CVSS スコア</span>
          <span class="font-bold text-red-500">9.8</span>
        </div>
        <div class="h-1.5 rounded-full overflow-hidden" style="background:rgba(0,0,0,0.08)">
          <div class="h-full rounded-full bg-red-400" style="width:98%"></div>
        </div>
      </div>
    </div>

    <div class="neu-card p-4">
      <div class="flex justify-between items-center mb-2">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-orange-400 shadow-sm"></span>
          <span class="text-xs font-bold text-orange-500">HIGH</span>
          <span class="text-xs text-gray-400">JVN</span>
        </div>
        <span class="text-xs text-gray-400">15分前</span>
      </div>
      <div class="text-base font-bold text-gray-700 mb-1">JVN#12345678</div>
      <div class="text-sm text-gray-500 mb-3">OpenSSL バッファオーバーフロー脆弱性</div>
      <div class="neu-inset px-3 py-2">
        <div class="flex justify-between text-xs text-gray-400 mb-1">
          <span>CVSS スコア</span>
          <span class="font-bold text-orange-500">7.5</span>
        </div>
        <div class="h-1.5 rounded-full overflow-hidden" style="background:rgba(0,0,0,0.08)">
          <div class="h-full rounded-full bg-orange-400" style="width:75%"></div>
        </div>
      </div>
    </div>

    <div class="neu-card p-4">
      <div class="flex justify-between items-center mb-2">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-red-400 shadow-sm"></span>
          <span class="text-xs font-bold text-red-500">CRITICAL</span>
          <span class="text-xs text-gray-400">CVE</span>
        </div>
        <span class="text-xs text-gray-400">22分前</span>
      </div>
      <div class="text-base font-bold text-gray-700 mb-1">CVE-2024-5678</div>
      <div class="text-sm text-gray-500 mb-3">Linux Kernel 権限昇格 (LPE)</div>
      <div class="neu-inset px-3 py-2">
        <div class="flex justify-between text-xs text-gray-400 mb-1">
          <span>CVSS スコア</span>
          <span class="font-bold text-red-500">9.3</span>
        </div>
        <div class="h-1.5 rounded-full overflow-hidden" style="background:rgba(0,0,0,0.08)">
          <div class="h-full rounded-full bg-red-400" style="width:93%"></div>
        </div>
      </div>
    </div>

    <div class="neu-card p-4">
      <div class="flex justify-between items-center mb-2">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-yellow-400 shadow-sm"></span>
          <span class="text-xs font-bold text-yellow-500">MEDIUM</span>
          <span class="text-xs text-gray-400">RSS</span>
        </div>
        <span class="text-xs text-gray-400">1時間前</span>
      </div>
      <div class="text-base font-bold text-gray-700 mb-1">セキュリティブログ</div>
      <div class="text-sm text-gray-500">新しいフィッシング攻撃手法が確認される</div>
    </div>

  </div>

  <!-- Bottom nav (neumorphism) -->
  <div class="flex px-4 py-2 gap-2" style="box-shadow: inset 0 2px 6px #b5bcc8;">
    <button class="neu-btn flex-1 py-2.5 flex flex-col items-center gap-0.5">
      <span class="text-xl">🏠</span>
      <span class="text-xs text-indigo-600 font-medium">フィード</span>
    </button>
    <button class="neu-btn flex-1 py-2.5 flex flex-col items-center gap-0.5">
      <span class="text-xl">📡</span>
      <span class="text-xs text-gray-500">ソース</span>
    </button>
    <button class="neu-btn flex-1 py-2.5 flex flex-col items-center gap-0.5">
      <span class="text-xl">⚡</span>
      <span class="text-xs text-gray-500">ルール</span>
    </button>
    <button class="neu-btn flex-1 py-2.5 flex flex-col items-center gap-0.5">
      <span class="text-xl">⚙️</span>
      <span class="text-xs text-gray-500">設定</span>
    </button>
  </div>
</div>
</body>
</html>
